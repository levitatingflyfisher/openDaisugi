[package]
name = "daisugi-verify-conform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conform"
path = "src/main.rs"

[lib]
name = "daisugi_verify"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
regex = "1"
thiserror = "1"

[profile.release]
opt-level = 3
