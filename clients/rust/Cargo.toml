[package]
name = "daisugi-verify-conform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conform"
path = "src/main.rs"

[[bin]]
name = "daisugi-gate"
path = "src/bin/daisugi_gate.rs"

[[bin]]
name = "daisugi"
path = "src/bin/daisugi.rs"

# A test instrument for clients/pathway_compare.py: find on many queries
# in one process. It is not shipped.
[[bin]]
name = "pathway-probe"
path = "src/bin/pathway_probe.rs"

# A test instrument for clients/gateway_compare.py --fuzz: turn sequences
# through the gateway pipeline in one process. It is not shipped.
[[bin]]
name = "gateway-probe"
path = "src/bin/gateway_probe.rs"

# A test instrument for clients/gateway_compare.py: recall and
# recall_answer on the oracle's cases. It is not shipped.
[[bin]]
name = "recall-probe"
path = "src/bin/recall_probe.rs"

# A test instrument for clients/k1_compare.py: one query of the envgen
# library per run. It is not shipped.
[[bin]]
name = "envelope-probe"
path = "src/bin/envelope_probe.rs"

# A test instrument for clients/l_compare.py: one query of the stage-L
# library parts no command reaches. It is not shipped.
[[bin]]
name = "l-probe"
path = "src/bin/l_probe.rs"

[[bin]]
name = "voice-probe"
path = "src/bin/voice_probe.rs"

# A test instrument for clients/alias_compare.py: the alias registry on
# the oracle's cases. It is not shipped.
[[bin]]
name = "alias-probe"
path = "src/bin/alias_probe.rs"

# A test instrument for clients/robotics_compare.py: the robotics executors
# on the robotics cases. It is not shipped.
[[bin]]
name = "robot-probe"
path = "src/bin/robot_probe.rs"
required-features = ["mujoco"]

[[bin]]
name = "vla-probe"
path = "src/bin/vla_probe.rs"
required-features = ["mujoco"]

[lib]
name = "daisugi_verify"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
regex = "1"
thiserror = "1"
libc = "0.2"
# pydantic-core's JSON parser, for the envelope file.
jiter = { version = "=0.14.0", default-features = false, features = ["num-bigint"] }
# Z3 5.1.0, built from the source the z3-src crate pins and linked statically.
z3-sys = { version = "=0.13.1", features = ["vendored"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# SQLite for the pathway store, the public-domain amalgamation compiled in.
rusqlite = { version = "=0.31.0", features = ["bundled"] }
# Exact integers for the gateway's token counts, as Python's int. Already
# in the tree through jiter.
num-bigint = "0.4"
num-traits = "0.2"
# The gzip and deflate decoders the gateway applies to an upstream answer,
# as httpx does. Pure Rust, no C.
miniz_oxide = "0.8"
# ed25519 signing and verifying for pathway bundles and release
# manifests. Already in the tree through rustls.
ring = "0.17"

[features]
# The robotics executors over MuJoCo (src/mujoco, src/robotics), the VLA
# executor over ONNX Runtime (src/ort, src/smolvla) and their probe. Off by
# default: the shipped binaries never link MuJoCo or ONNX Runtime. Needs the
# prefixes clients/go/scripts/native.sh --mujoco and --onnxruntime install,
# a C compiler, and libmujoco.so and libonnxruntime.so.1 on the loader's
# path at run time.
mujoco = ["dep:cc"]

[build-dependencies]
# Compiles the shared C layer clients/native/mujoco/dmj.c. Already in the
# tree through tree-sitter.
cc = { version = "1", optional = true }

[profile.release]
opt-level = 3

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
