[package]
name = "daisugi-verify-conform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conform"
path = "src/main.rs"

[[bin]]
name = "daisugi-gate"
path = "src/bin/daisugi_gate.rs"

[[bin]]
name = "daisugi"
path = "src/bin/daisugi.rs"

# A test instrument for clients/pathway_compare.py: find on many queries
# in one process. It is not shipped.
[[bin]]
name = "pathway-probe"
path = "src/bin/pathway_probe.rs"

[lib]
name = "daisugi_verify"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
regex = "1"
thiserror = "1"
libc = "0.2"
# pydantic-core's JSON parser, for the envelope file.
jiter = { version = "=0.14.0", default-features = false, features = ["num-bigint"] }
# Z3 5.1.0, built from the source the z3-src crate pins and linked statically.
z3-sys = { version = "=0.13.1", features = ["vendored"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# SQLite for the pathway store, the public-domain amalgamation compiled in.
rusqlite = { version = "=0.31.0", features = ["bundled"] }

[profile.release]
opt-level = 3

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
