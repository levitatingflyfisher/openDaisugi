[project]
name = "opendaisugi"
version = "0.43.0"
description = "Runtime assurance library: envelope generation, static verification, supervised execution, and journaling for agent actions."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenDaisugi Contributors" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "z3-solver>=4.13",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "typer>=0.12,<1",
    # v0.44: the clusterer (distiller.py) and pathway store already require numpy
    # at call time, and the lexical matcher (ADR-0019) needs it too — a zero-extra
    # `pip install opendaisugi` must still be able to distill pathways.
    "numpy>=1.26",
]

[project.optional-dependencies]
# v0.47: litellm-backed features only. The gate, verifier, CLI startup, and
# every coppice-invoked path (checked with -X importtime on
# `opendaisugi.gate --help`, a real gate-check payload,
# `import opendaisugi.verify`, and `daisugi --help`) never import these.
# Only the litellm backend for `daisugi generate-envelope` and `daisugi
# orchestrate` (llm.py, delegating_executor.py), the litellm-branch of
# llm_check's soft-node verification, the litellm episode-splitter, and the
# litellm voice-cleanup transport import them, all lazily. Absent, each of
# those raises ImportError naming this extra instead of a raw
# ModuleNotFoundError. claude-code-backend generation needs neither package.
generate = [
    # instructor and litellm release frequently with breaking 2.0 betas already
    # in flight; constrain upper bounds so a fresh install can't silently pick
    # up a major-version break.
    "instructor>=1.4,<2",
    "litellm>=1.50,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
    "build>=1.2",
    "twine>=5.0",
    # v0.28.5: include the test surface that's nominally light. [search]
    # pulls sentence-transformers (~80MB torch slice) which the pathway-
    # store / distiller tests need; without it 7 tests fail at import.
    # [mcp] is small and lights up another ~50 tests via test_mcp_server.
    # Heavy extras (lora=torch+peft+trl, robotics=mujoco) stay opt-in.
    "opendaisugi[search]",
    "opendaisugi[mcp]",
    "opendaisugi[shell]",
    "opendaisugi[sign]",
    "opendaisugi[gateway]",
    "opendaisugi[tui]",
    "opendaisugi[voice]",
    # The two torch-free matchers. tests/test_matcher_backend.py needs their
    # packages to reach the code paths it mocks. See ADR-0018 and ADR-0021.
    "opendaisugi[potion]",
    "opendaisugi[int8]",
    # v0.47: litellm-backend generation tests need it in the dev/test venv.
    "opendaisugi[generate]",
]
search = [
    "numpy>=1.26",
    "sentence-transformers>=2.7",
]
# v0.45: the torch-free pathway-reuse embedder. model2vec inference needs only
# numpy + tokenizers (no torch, no transformers — those live in its [distill]/[train]
# extras), so `matcher_model = potion` runs where [search]'s ~80MB torch slice can't:
# a GPU torch can't target, a machine too small for torch, or (with a pre-fetched
# local dir via OPENDAISUGI_POTION_MODEL + HF_HUB_OFFLINE) fully air-gapped. MIT,
# like the potion models. Absent => selecting potion degrades to a warned 0-pathway
# tend, exactly as a missing [search] does. See ADR-0018.
potion = [
    "numpy>=1.26",
    "model2vec>=0.9",
]
# v0.46: the second torch-free pathway-reuse embedder. MiniLM itself, quantized
# to int8 and run through onnxruntime, with no torch and no transformers. Needs
# a CPU with AVX2 or better, or aarch64. On an older CPU it refuses instead of
# a silent fallback. Fetches about 23MB from the official sentence-transformers
# repo on first use, pinned by sha256. MIT. When it is absent, selecting int8
# degrades to a warned lexical fallback, the same as a missing [search] or
# [potion].
# See ADR-0021.
int8 = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
]
# v0.45: the voice bridge. faster-whisper runs on CTranslate2, not torch, so it
# runs on a CPU-only box or on a box whose GPU cannot safely take torch workloads.
# `av` is PyAV, the webm or opus decode fallback for when the `ffmpeg` binary is
# absent. A WAV already at 16 kHz mono, or a box with ffmpeg present, never needs
# it. ADR-0019 sets the same torch-free precedent for a different codec.
voice = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "av>=13.0",
]
mcp = [
    "mcp>=1.27",
]
# v0.45: the opt-in second engine, NeMo Parakeet-TDT via sherpa-onnx. Its model is a
# roughly 460MB download. The voice bridge never fetches it automatically. See pins.py.
voice-parakeet = [
    "sherpa-onnx>=1.10",
]
# v0.44: the token-saving gateway's async transport — an OpenAI/Anthropic-compatible proxy
# any harness points at via base_url. Pure-Python (httpx); the ASGI app runs under any
# ASGI server (uvicorn, hypercorn). Absent => the routing/meter/journal layer still imports
# and works; only opendaisugi.gateway_asgi.make_gateway_app needs it.
gateway = [
    "httpx>=0.27",
    "uvicorn>=0.30",
]
# v0.40: real bash-grammar parsing for opt-in compound-shell decomposition
# (shell_allow_decomposition). Native-C but ships prebuilt abi3 wheels, so no
# build toolchain. See ADR-0010. Absent => decomposition is unavailable and an
# opted-in command is rejected fail-closed.
shell = [
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]
# v0.44: the interactive dashboard GUI (`daisugi dashboard --tui` / `--serve`). Textual
# (MIT) runs the same app in the terminal and, via local textual-serve, in a browser — one
# frontend, no external relay, no accounts. Opt-in: the plain `daisugi dashboard` stays
# pure-stdlib so the family tier never pulls this. See docs/reference/module-wiring.
tui = [
    "textual>=8.0",
    "textual-serve>=1.1",
]
robotics = [
    "mujoco>=3.0,<4.0",
    "numpy>=1.24",
]
lora = [
    "torch>=2.1",
    "transformers>=4.44",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "datasets>=2.19",
    "accelerate>=0.30",
]
sign = [
    "cryptography>=42.0",
]

[project.scripts]
daisugi = "opendaisugi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendaisugi"]
artifacts = [
    "src/opendaisugi/skills/**/*.md",
    "src/opendaisugi/install_assets/**/*",
    "src/opendaisugi/viz_dag_template.html",
    "src/opendaisugi/harness_pi/**/*",
    "src/opendaisugi/harness_opencode/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "calibration: runs against the real LLM API; requires ANTHROPIC_API_KEY",
    "smoke: end-to-end prompt sanity via `claude -p`; requires DAISUGI_SMOKE=1",
    "voice_live: transcribes with a real speech-to-text engine; requires DAISUGI_VOICE_LIVE=1",
]

[tool.ruff]
# Target the existing style: 100-col soft target (E501 not enforced — long lines
# are grandfathered; see docs/architecture/CONVENTIONS.md).
line-length = 100
target-version = "py312"

[tool.ruff.format]
# ADR-0009: adopt ruff format as the one formatter. Defaults (double quotes,
# 100-col from [tool.ruff] above). Enforced in CI via `ruff format --check`.

[tool.ruff.lint]
# Real-bug + import-hygiene rules only. Deliberately NOT: E501 (line length — noise,
# not correctness), UP (pyupgrade — style modernization that would mass-rewrite
# annotations), E402 (module-import-not-at-top — openDaisugi uses function-local &
# conditional imports on purpose, for optional deps and circular-import avoidance;
# see CONVENTIONS.md). Tighten later via a new ADR if the team wants more.
select = ["F", "E9", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
# typer builds CLIs by putting typer.Option(...)/Argument(...) in argument defaults;
# that is the framework idiom, not the B008 "mutable/expensive default" bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API; "unused import" / star-import are intentional.
"__init__.py" = ["F401", "F403"]
# B008: the CLI computes typer.Option defaults like `Path.home() / ...` at import —
#   benign for a short-lived process; not the mutable/expensive-default hazard.
# B904: `raise typer.Exit(code=N)` after echoing the error is control flow, not error
#   propagation — chaining `from err` would attach a traceback the user never sees.
"cli.py" = ["B008", "B904"]
# Tests favor readability over strict hygiene: fixtures/redefs look "unused" (F811),
# imports mid-file are common (E402), a var can document intent unused (F841), and
# `assert False` is a fine "unreachable" marker in a test (B011).
"tests/*" = ["F811", "E402", "F841", "B011"]
