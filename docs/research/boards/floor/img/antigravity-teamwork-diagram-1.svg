<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" style="display:block;background:#ffffff;font-family:'Google Sans',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Directional Flow Connector Arrow -->
    <marker id="arrSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="6" y="6" width="988" height="188" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ======================================================================= -->
  <!-- FLOW CONNECTOR ARROWS                                                   -->
  <!-- ======================================================================= -->
  <g stroke="#64748B" stroke-width="2" fill="none">
    <!-- Box 1 -> Box 2 -->
    <line x1="248" y1="100" x2="268" y2="100" marker-end="url(#arrSlate)"/>
    <!-- Box 2 -> Box 3 -->
    <line x1="488" y1="100" x2="508" y2="100" marker-end="url(#arrSlate)"/>
    <!-- Box 3 -> Box 4 -->
    <line x1="728" y1="100" x2="748" y2="100" marker-end="url(#arrSlate)"/>
  </g>

  <!-- ======================================================================= -->
  <!-- BOX 1: 1. SCOPING (SENTINEL)                                            -->
  <!-- ======================================================================= -->
  <g transform="translate(32, 18)">
    <rect width="216" height="164" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Phase Pill Badge -->
    <rect x="12" y="12" width="108" height="20" rx="5" fill="#0F172A"/>
    <text x="66" y="25.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">1. SCOPING</text>
    
    <!-- Title & Role -->
    <text x="12" y="50" fill="#0F172A" font-size="12.5" font-weight="700">🛡️ Sentinel</text>
    <text x="12" y="64" fill="#64748B" font-size="10" font-weight="600">Permanent Lead</text>
    
    <!-- Description -->
    <text x="12" y="84" fill="#334155" font-size="10" font-weight="500">Interviews user &amp; agrees</text>
    <text x="12" y="98" fill="#334155" font-size="10" font-weight="500">scope &amp; success criteria</text>
    
    <!-- Contract Chip -->
    <rect x="12" y="116" width="192" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="131" fill="#0F172A" font-size="9.5" font-weight="700">🔒 Specification Plan</text>
    <text x="20" y="144" fill="#64748B" font-size="8.5">Ground-truth specification</text>
  </g>

  <!-- ======================================================================= -->
  <!-- BOX 2: 2. COORDINATION (PROJECT ORCHESTRATOR)                           -->
  <!-- ======================================================================= -->
  <g transform="translate(272, 18)">
    <rect width="216" height="164" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Phase Pill Badge -->
    <rect x="12" y="12" width="130" height="20" rx="5" fill="#334155"/>
    <text x="77" y="25.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">2. COORDINATION</text>
    
    <!-- Title & Role -->
    <text x="12" y="50" fill="#0F172A" font-size="12.5" font-weight="700">🧠 Project Orchestrator</text>
    <text x="12" y="64" fill="#64748B" font-size="10" font-weight="600">Self-Succession Lead</text>
    
    <!-- Description -->
    <text x="12" y="84" fill="#334155" font-size="10" font-weight="500">Decomposes milestones &amp;</text>
    <text x="12" y="98" fill="#334155" font-size="10" font-weight="500">coordinates parallel tracks</text>
    
    <!-- Roadmap Chip -->
    <rect x="12" y="116" width="192" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="131" fill="#0F172A" font-size="9.5" font-weight="700">📋 Project Roadmap</text>
    <text x="20" y="144" fill="#64748B" font-size="8.5">Milestone roadmap &amp; tracks</text>
  </g>

  <!-- ======================================================================= -->
  <!-- BOX 3: 3. EXECUTION (EXPLORERS & ARMED WORKERS)                         -->
  <!-- ======================================================================= -->
  <g transform="translate(512, 18)">
    <rect width="216" height="164" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Phase Pill Badge -->
    <rect x="12" y="12" width="108" height="20" rx="5" fill="#334155"/>
    <text x="66" y="25.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">3. EXECUTION</text>
    
    <!-- Title & Role -->
    <text x="12" y="50" fill="#0F172A" font-size="12.5" font-weight="700">⚙️ Explorers &amp; Workers</text>
    <text x="12" y="64" fill="#64748B" font-size="10" font-weight="600">Parallel Execution Tracks</text>
    
    <!-- Description -->
    <text x="12" y="84" fill="#334155" font-size="10" font-weight="500">Survey codebase topology,</text>
    <text x="12" y="98" fill="#334155" font-size="10" font-weight="500">implement code &amp; local tests</text>
    
    <!-- Parallel Tracks Chip -->
    <rect x="12" y="116" width="192" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="131" fill="#0F172A" font-size="9.5" font-weight="700">Parallel File Locks</text>
    <text x="20" y="144" fill="#64748B" font-size="8.5">Isolated, non-overlapping diffs</text>
  </g>

  <!-- ======================================================================= -->
  <!-- BOX 4: 4. VERIFICATION (CRITICS & SUCCESS AUDITOR)                       -->
  <!-- ======================================================================= -->
  <g transform="translate(752, 18)">
    <rect width="216" height="164" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Phase Pill Badge -->
    <rect x="12" y="12" width="125" height="20" rx="5" fill="#0F172A"/>
    <text x="74.5" y="25.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">4. VERIFICATION</text>
    
    <!-- Title & Role -->
    <text x="12" y="50" fill="#0F172A" font-size="12.5" font-weight="700">⚖️ Critics &amp; Success Auditor</text>
    <text x="12" y="64" fill="#64748B" font-size="10" font-weight="600">Multi-Angle Verification</text>
    
    <!-- Description -->
    <text x="12" y="84" fill="#334155" font-size="10" font-weight="500">Independent multi-gate audit</text>
    <text x="12" y="98" fill="#334155" font-size="10" font-weight="500">→ Verified Result signoff</text>
    
    <!-- Outcome Chip -->
    <rect x="12" y="116" width="192" height="36" rx="6" fill="#0F172A"/>
    <text x="20" y="131" fill="#FFFFFF" font-size="9.5" font-weight="700">🏆 SUCCESS CONFIRMED</text>
    <text x="20" y="144" fill="#94A3B8" font-size="8.5">Verified Result</text>
  </g>
</svg>
